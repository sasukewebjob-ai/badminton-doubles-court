<style>

<body>

<h1>🏸 ダブルス コート割</h1>

<div class="input-section">
  <div class="input-row">
    <label>コート数</label>
    <select id="courtCount">
      <option value="2">2コート</option>
      <option value="3">3コート</option>
      <option value="4" selected>4コート</option>
    </select>
  </div>
  <div class="input-row" id="playerCountRow">
    <label>参加人数</label>
    <select id="playerCount"></select>
  </div>
  <div class="input-row">
    <label>節数</label>
    <select id="roundCount">
      <option value="10" selected>10節</option>
      <option value="15">15節</option>
      <option value="20">20節</option>
      <option value="25">25節</option>
      <option value="30">30節</option>
    </select>
  </div>
  <div class="input-row">
    <label>休み順</label>
    <select id="restOrder">
      <option value="asc">1番から休む</option>
      <option value="desc" selected>最後の番号から休む</option>
    </select>
  </div>
  <div class="chips-label">参加メンバー（タップで選択）<button class="roster-clear" onclick="clearRoster()">全解除</button></div>
  <div class="chips" id="rosterChips"></div>
  <div class="roster-count" id="rosterCount">未選択（番号のみで作成します）</div>
  <div class="info-box" id="infoBox"></div>
  <button class="btn" id="generateBtn" onclick="generate()">コート割を作成</button>
</div>

<div id="results"></div>

<script>
const COURT_LABELS = ['A','B','C','D'];
// 固定名簿（KALIDIAコート割の members.txt と共有。メンバーが変わったらここと下のKANAを更新する）
const ROSTER = [
  // 男性
  '大野','唐澤','北原','越野','小林','善志','高橋','原','バレ','根津','細井','松武','宮澤輝','渡辺',
  // 女性
  '濱島','内田','春日','黒河内','纐纈','後藤','柴','下平','田中','宮澤真','宮下','依田',
];
// 読み上げ用フリガナ（対応がない名前は漢字のまま読み上げエンジンに渡す）
const KANA = {
  '大野':'おおの','唐澤':'からさわ','北原':'きたはら','越野':'こしの','小林':'こばやし','善志':'ぜんし','高橋':'たかはし','原':'はら','バレ':'ばれ','根津':'ねづ','細井':'ほそい','松武':'まつたけ','宮澤輝':'みやざわてる','渡辺':'わたなべ',
  '濱島':'はましま','内田':'うちだ','春日':'かすが','黒河内':'くろごうち','纐纈':'こうけつ','後藤':'ごとう','柴':'しば','下平':'しもだいら','田中':'たなか','宮澤真':'みやざわまほ','宮下':'みやした','依田':'よだ',
};
// 番号の表示名（名簿モードなら「1 田中」、番号のみなら「1番」）
function pname(p) {
  const nm = session && session.names && session.names[p];
  return nm ? p + ' ' + nm : p + '番';
}
// 読み上げ用の呼び名（名簿モードならフリガナ、番号のみなら「5番」）
function sname(p) {
  const nm = session && session.names && session.names[p];
  return nm ? (KANA[nm] || nm) : p + '番';
}
// 節の読み上げ文（例:「第3節の対戦を読み上げます！Aコート、たなか・すずき 対 こばやし・はら。休み、よだ。」）
function roundSpeechText(round) {
  const parts = [`だい${round.round}せつのたいせんをよみあげます！`];
  round.assignments.forEach((court, idx) => {
    const p1 = [...court.pair1].sort((a, b) => a - b);
    const p2 = [...court.pair2].sort((a, b) => a - b);
    const [left, right] = p1[0] <= p2[0] ? [p1, p2] : [p2, p1];
    parts.push(`${COURT_LABELS[idx]}コート、${sname(left[0])}、${sname(left[1])}、たい、${sname(right[0])}、${sname(right[1])}`);
  });
  if (round.resting.length > 0) {
    parts.push(`やすみ、${round.resting.map(sname).join('、')}`);
  }
  return parts.join('。') + '。';
}
// 読み上げの実行（同じ節をもう一度タップで停止）
let speakingRound = null;
function speakRound(rn) {
  if (!('speechSynthesis' in window)) {
    alert('この端末は音声読み上げに対応していません');
    return;
  }
  if (speakingRound === rn) { stopSpeech(); return; }
  speechSynthesis.cancel();
  const round = session.rounds.find(r => r.round === rn);
  if (!round) return;
  const u = new SpeechSynthesisUtterance(roundSpeechText(round));
  u.lang = 'ja-JP';
  u.rate = 0.99;   // 1.0が標準速度（0.9から10%アップ、ユーザー要望）
  u.volume = 1.0;  // APIの上限。端末のメディア音量を超える増幅は仕様上不可
  u.onend = u.onerror = () => {
    if (speakingRound === rn) { speakingRound = null; updateSpeakButtons(); }
  };
  speakingRound = rn;
  updateSpeakButtons();
  speechSynthesis.speak(u);
}
function stopSpeech() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speakingRound = null;
  updateSpeakButtons();
}
function updateSpeakButtons() {
  document.querySelectorAll('.btn-speak').forEach(b => {
    const active = Number(b.dataset.round) === speakingRound;
    b.classList.toggle('speaking', active);
    b.textContent = active ? '⏹ 停止' : '🔊';
  });
}
let TOTAL_ROUNDS = 20;
let lastRounds = null;
// セッション状態（途中のメンバー変更に使用）
// players: 現在の参加者番号 / everPlayers: 参加経験のある全番号 / changes: 変更履歴
let session = null;

// --- localStorage永続化 ---
// 体育館でタブが落ちても状態が残るよう、生成・メンバー変更のたびに保存する
const STORAGE_KEY = 'badminton-court-session-v1';
let restoredAt = null; // 復元直後のみ保存日時が入る（バナー表示用）

function saveSession() {
  // 閲覧モードでは保存しない（共有を見た人自身のコート割を壊さない）
  if (!session || viewerMode) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: 1, savedAt: Date.now(), session }));
  } catch (e) {
    // プライベートモード等で保存できなくてもアプリは継続
  }
}

function clearSavedSession() {
  if (!confirm('保存されたコート割を消去して、最初からやり直しますか？')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  session = null;
  lastRounds = null;
  restoredAt = null;
  document.getElementById('results').replaceChildren();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restoreSession() {
  let data;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    data = JSON.parse(raw);
  } catch (e) {
    return false;
  }
  const s = data && data.session;
  if (!s || !Array.isArray(s.rounds) || s.rounds.length === 0 ||
      !Array.isArray(s.players) || !Array.isArray(s.everPlayers) || !Array.isArray(s.changes)) {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    return false;
  }
  // 旧データや壊れた names は番号のみモードとして扱う
  if (s.names && (typeof s.names !== 'object' || Array.isArray(s.names))) s.names = null;
  session = s;
  lastRounds = s.rounds;
  TOTAL_ROUNDS = s.totalRounds;
  restoredAt = data.savedAt || null;

  // 入力欄も復元したセッションに合わせる（次回再生成時の初期値として自然に）
  const courtSel = document.getElementById('courtCount');
  if (courtSel.querySelector(`option[value="${s.courts}"]`)) {
    courtSel.value = s.courts;
    courtSel.dispatchEvent(new Event('change')); // 人数の選択肢を再構築
  }
  const playerSel = document.getElementById('playerCount');
  if (playerSel.querySelector(`option[value="${s.players.length}"]`)) {
    playerSel.value = s.players.length;
    updateInfo();
  }
  const roundSel = document.getElementById('roundCount');
  if (roundSel.querySelector(`option[value="${s.totalRounds}"]`)) {
    roundSel.value = s.totalRounds;
  }
  // 旧バージョンの保存データには restOrder が無い → 従来仕様の「1番から」
  document.getElementById('restOrder').value = s.restOrder === 'desc' ? 'desc' : 'asc';

  // 名簿チップも復元セッションに合わせる（次回再生成時に同じメンバーが初期選択に）
  if (s.names) {
    const activeNames = new Set(s.players.map(p => s.names[p]).filter(Boolean));
    document.querySelectorAll('#rosterChips .chip').forEach(b =>
      b.classList.toggle('selected', activeNames.has(b.dataset.name)));
  }
  onRosterChange();

  renderResults();
  return true;
}

// --- 対戦表の共有（URLにセッションを埋め込む） ---
// サーバー不要で「リンクを開くだけで同じ対戦表が見える」ようにする。
// 番号・節数は小さい整数なので、独自の可変長エンコードでURLを短く保つ
// （JSON+base64より大幅に短く、15節で400文字前後に収まる）
const SHARE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const SHARE_INDEX = {};
for (let i = 0; i < 64; i++) SHARE_INDEX[SHARE_CHARS[i]] = i;
let viewerMode = false; // 共有リンクの閲覧モード（編集UI・localStorage保存を無効化）
let sharedAt = null;    // 共有リンクの作成日時（バナー表示用）

// 0〜47は1文字、48〜1071は2文字
function encInt(v) {
  if (!Number.isInteger(v) || v < 0 || v > 1071) throw new Error('encInt range: ' + v);
  if (v < 48) return SHARE_CHARS[v];
  v -= 48;
  return SHARE_CHARS[48 + (v >> 6)] + SHARE_CHARS[v & 63];
}

function encList(arr) {
  return encInt(arr.length) + arr.map(encInt).join('');
}

// 名前マップ {番号: 名前} をURL安全なbase64urlに（日本語対応、共有データ末尾に付加）
function encodeNamesBlob(names) {
  const bytes = new TextEncoder().encode(JSON.stringify(names));
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeNamesBlob(blob) {
  try {
    if (!blob) return null;
    let b64 = blob.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
    const names = {};
    for (const k in obj) {
      const num = parseInt(k, 10);
      if (!Number.isInteger(num) || num < 1 || num > 1071) return null;
      if (typeof obj[k] !== 'string' || obj[k].length === 0 || obj[k].length > 20) return null;
      names[num] = obj[k];
    }
    return names;
  } catch (e) {
    return null;
  }
}

function encodeShareData() {
  const s = session;
  // 作成時刻（分単位・固定5文字）。再共有されたとき新旧を見分けられるように
  const minutes = Math.floor(Date.now() / 60000);
  let ts = '';
  for (let i = 4; i >= 0; i--) ts += SHARE_CHARS[(minutes >> (6 * i)) & 63];
  // 名前付きはバージョン'2'（末尾に名前ブロック）。番号のみは従来の'1'のまま
  let out = (s.names ? '2' : '1') + ts;
  out += encInt(s.totalRounds) + encInt(s.initialCourts);
  out += encInt(s.restOrder === 'desc' ? 1 : 0) + encInt(s.maxNumber);
  out += encList(s.players) + encList(s.everPlayers);
  out += encInt(s.changes.length);
  for (const c of s.changes) {
    out += encInt(c.atRound) + encInt(c.courts);
    out += encList(c.added) + encList(c.removed) + encList(c.returned || []);
  }
  out += encInt(s.rounds.length);
  for (const r of s.rounds) {
    out += encInt(r.round) + encInt(r.assignments.length) + encList(r.resting);
    for (const a of r.assignments) {
      out += encInt(a.pair1[0]) + encInt(a.pair1[1]) + encInt(a.pair2[0]) + encInt(a.pair2[1]);
    }
  }
  if (s.names) out += encodeNamesBlob(s.names);
  return out;
}

// 壊れた・途切れたリンクでも例外を漏らさず null を返す
function decodeShareData(str) {
  try {
    if (typeof str !== 'string' || (str[0] !== '1' && str[0] !== '2')) return null;
    const version = str[0];
    let pos = 1;
    const ch = () => {
      const v = SHARE_INDEX[str[pos++]];
      if (v === undefined) throw new Error('bad char');
      return v;
    };
    const readInt = () => {
      const v = ch();
      return v < 48 ? v : 48 + ((v - 48) << 6) + ch();
    };
    const readList = () => {
      const len = readInt();
      const arr = [];
      for (let i = 0; i < len; i++) arr.push(readInt());
      return arr;
    };
    let ts = 0;
    for (let i = 0; i < 5; i++) ts = ts * 64 + ch();
    const s = {};
    s.totalRounds = readInt();
    s.initialCourts = readInt();
    s.restOrder = readInt() === 1 ? 'desc' : 'asc';
    s.maxNumber = readInt();
    s.players = readList();
    s.everPlayers = readList();
    s.changes = [];
    const nChanges = readInt();
    for (let i = 0; i < nChanges; i++) {
      const c = { atRound: readInt(), courts: readInt() };
      c.added = readList();
      c.removed = readList();
      c.returned = readList();
      s.changes.push(c);
    }
    s.rounds = [];
    const nRounds = readInt();
    for (let i = 0; i < nRounds; i++) {
      const round = { round: readInt() };
      const nCourts = readInt();
      round.resting = readList();
      round.assignments = [];
      for (let j = 0; j < nCourts; j++) {
        round.assignments.push({ pair1: [readInt(), readInt()], pair2: [readInt(), readInt()] });
      }
      s.rounds.push(round);
    }
    if (version === '2') {
      // 残り全部が名前ブロック
      s.names = decodeNamesBlob(str.slice(pos));
      if (!s.names) return null;
    } else {
      if (pos !== str.length) return null;
      s.names = null;
    }
    if (s.rounds.length === 0 || s.players.length === 0) return null;
    return { sharedAt: ts * 60000, session: s };
  } catch (e) {
    return null;
  }
}

function buildShareUrl() {
  return location.href.split('#')[0] + '#s=' + encodeShareData();
}

async function shareLink() {
  if (!session) return;
  let url;
  try {
    url = buildShareUrl();
  } catch (e) {
    alert('共有リンクを作成できませんでした。');
    return;
  }
  // スマホはOSの共有シート（LINE等に直接送れる）、使えなければコピー
  if (navigator.share) {
    try {
      await navigator.share({ title: '今日の対戦表', url });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // ユーザーが共有シートを閉じただけ
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert('対戦表のリンクをコピーしました。\nLINEなどに貼り付けて送ってください。');
  } catch (e) {
    prompt('このリンクをコピーして共有してください', url);
  }
}

function loadFromShareLink() {
  if (!location.hash.startsWith('#s=')) return false;
  const decoded = decodeShareData(location.hash.slice(3));
  if (!decoded) {
    alert('共有リンクを読み込めませんでした。\nリンクが途中で切れていないか、送った人に確認してください。');
    history.replaceState(null, '', location.pathname + location.search);
    return false;
  }
  viewerMode = true;
  sharedAt = decoded.sharedAt;
  session = decoded.session;
  lastRounds = session.rounds;
  TOTAL_ROUNDS = session.totalRounds;
  document.querySelector('.input-section').style.display = 'none';
  renderResults();
  return true;
}

function exitViewerMode() {
  history.replaceState(null, '', location.pathname + location.search);
  location.reload();
}

// --- UI初期化 ---
function initUI() {
  const courtSel = document.getElementById('courtCount');
  const playerSel = document.getElementById('playerCount');

  function updatePlayerOptions() {
    const courts = parseInt(courtSel.value);
    const minPlayers = courts * 4;
    const maxPlayers = 24;
    playerSel.innerHTML = '';
    for (let i = minPlayers; i <= maxPlayers; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.text = i + '人';
      playerSel.appendChild(opt);
    }
    const defaultVal = minPlayers + 2;
    if (playerSel.querySelector(`option[value="${defaultVal}"]`)) {
      playerSel.value = defaultVal;
    }
    updateInfo();
  }

  courtSel.addEventListener('change', updatePlayerOptions);
  playerSel.addEventListener('change', updateInfo);

  // 名簿チップ（タップで参加/不参加を切り替え）
  const rosterDiv = document.getElementById('rosterChips');
  for (const nm of ROSTER) {
    const b = document.createElement('button');
    b.className = 'chip chip-roster';
    b.dataset.name = nm;
    b.textContent = nm;
    b.onclick = () => { b.classList.toggle('selected'); onRosterChange(); };
    rosterDiv.appendChild(b);
  }

  updatePlayerOptions();
}

function selectedRosterNames() {
  return Array.from(document.querySelectorAll('#rosterChips .chip.selected')).map(b => b.dataset.name);
}

function clearRoster() {
  document.querySelectorAll('#rosterChips .chip.selected').forEach(b => b.classList.remove('selected'));
  onRosterChange();
}

function onRosterChange() {
  const n = selectedRosterNames().length;
  // 名簿から選んでいる間は人数セレクトを隠し、選択人数をそのまま使う
  document.getElementById('playerCountRow').style.display = n > 0 ? 'none' : '';
  document.getElementById('rosterCount').textContent = n > 0
    ? `選択中: ${n}人（番号は作成時に自動でランダムに振られます）`
    : '未選択（番号のみで作成します）';
  updateInfo();
}

function updateInfo() {
  const courts = parseInt(document.getElementById('courtCount').value);
  const rosterN = selectedRosterNames().length;
  const players = rosterN > 0 ? rosterN : parseInt(document.getElementById('playerCount').value);
  const playingCount = courts * 4;
  const restCount = players - playingCount;
  const info = document.getElementById('infoBox');
  info.replaceChildren();
  const addLine = (text, warn) => {
    if (info.childNodes.length > 0) info.appendChild(document.createElement('br'));
    const span = document.createElement('span');
    if (warn) span.style.color = '#c0392b';
    span.textContent = text;
    info.appendChild(span);
  };
  if (restCount < 0) {
    addLine(`⚠️ ${courts}コートには最低${playingCount}人必要です（現在${players}人）。コート数を減らすかメンバーを追加してください。`, true);
  } else if (restCount === 0) {
    addLine(`全員プレー（休みなし）。${courts}コート × 4人 = ${playingCount}人`);
  } else {
    addLine(`毎節 ${restCount}人が休み、${playingCount}人がプレー。`);
  }
  if (players > 24) {
    addLine('⚠️ 参加人数の上限は24人です。', true);
  }
  if (restCount > playingCount) {
    addLine('⚠️ 休みのほうが多い構成です。コート数を増やすか人数を減らすことを推奨。', true);
  }
}

// --- 休み人決定（ストライド方式 + 境目公平化） ---
// 方針:
//   各周k は stride=k で休みグループを形成（番号順をベース）
//     1周目 stride1: [1,2,3] [4,5,6] ...
//     2周目 stride2: [1,3,5] [2,4,6] ... (端数は連番)
//     3周目 stride3: [1,4,7] [2,5,8] [3,6,9] ...
//   各周内ではグループの最小番号順で出題（小番号が早く休む）
//   N が restCount で割り切れない場合は、周の境目で次周の先頭を「先取り」して休む。
//   その先取りは boundaryHits をローテーションして全員に均等配分（公平化）。
//   休み回数の差は常に最大1を厳守。

function makeStrideGroups(N, cycle, restCount) {
  const stride = cycle;
  const used = new Set();
  const groups = [];

  for (let offset = 0; offset < stride; offset++) {
    const candidates = [];
    for (let i = 0; offset + 1 + i * stride <= N; i++) {
      candidates.push(offset + 1 + i * stride);
    }
    for (let i = 0; i + restCount <= candidates.length; i += restCount) {
      const group = candidates.slice(i, i + restCount);
      groups.push(group);
      group.forEach(p => used.add(p));
    }
  }

  const leftovers = [];
  for (let p = 1; p <= N; p++) {
    if (!used.has(p)) leftovers.push(p);
  }
  for (let i = 0; i < leftovers.length; i += restCount) {
    groups.push(leftovers.slice(i, i + restCount));
  }

  groups.sort((a, b) => a[0] - b[0]);
  return groups;
}

function strideLinearOrder(N, cycle, restCount) {
  return makeStrideGroups(N, cycle, restCount).flat();
}

// players: 参加者番号の配列（欠番可）
// initialRestCounts: 引き継ぐ休み回数（途中変更時）。省略時は全員0
// prevResting: 直前節の休み（境目の連続休み回避に使用）。省略可
// reverse: trueなら最後の番号から休む（並び位置の基準を降順にするだけで公平性は同一）
function generateRestSchedule(players, restCount, numRounds, initialRestCounts, prevResting, reverse) {
  if (restCount === 0) return Array.from({length: numRounds}, () => []);

  const allPlayers = players.slice().sort((a, b) => reverse ? b - a : a - b);
  const M = allPlayers.length;
  // 欠番があってもストライドが機能するよう、番号順の並び位置(1..M)で組んで番号に戻す
  const playerAt = pos => allPlayers[pos - 1];

  const restCounts = {};
  const boundaryHits = {};
  allPlayers.forEach(p => {
    restCounts[p] = (initialRestCounts && initialRestCounts[p]) || 0;
    boundaryHits[p] = 0;
  });

  const restSchedule = [];
  let prevSet = new Set(prevResting || []);
  const linearOrderCache = {};
  const getLinearOrder = (cycle) => {
    if (!linearOrderCache[cycle]) {
      linearOrderCache[cycle] = strideLinearOrder(M, cycle, restCount).map(playerAt);
    }
    return linearOrderCache[cycle];
  };

  while (restSchedule.length < numRounds) {
    let curMin = Infinity;
    for (const p of allPlayers) {
      if (restCounts[p] < curMin) curMin = restCounts[p];
    }
    const poolA = allPlayers.filter(p => restCounts[p] === curMin);
    const poolB = allPlayers.filter(p => restCounts[p] === curMin + 1);

    const cycleA = curMin + 1;
    const linearA = getLinearOrder(cycleA);
    const rankA = new Map();
    linearA.forEach((p, i) => rankA.set(p, i));

    const orderedA = poolA.slice().sort((a, b) => {
      const ra = rankA.has(a) ? rankA.get(a) : 0;
      const rb = rankA.has(b) ? rankA.get(b) : 0;
      return ra - rb;
    });

    let picks;
    let fillersFromB = [];

    if (orderedA.length >= restCount) {
      // ストライド順を厳守（連続休み回避はpoolBの軟制約のみ）
      picks = orderedA.slice(0, restCount);
    } else {
      const need = restCount - orderedA.length;
      const cycleB = curMin + 2;
      const linearB = getLinearOrder(cycleB);
      const rankB = new Map();
      linearB.forEach((p, i) => rankB.set(p, i));

      const orderedB = poolB.slice().sort((a, b) => {
        if (boundaryHits[a] !== boundaryHits[b]) {
          return boundaryHits[a] - boundaryHits[b];
        }
        const ra = rankB.has(a) ? rankB.get(a) : 0;
        const rb = rankB.has(b) ? rankB.get(b) : 0;
        return ra - rb;
      });

      const nonPrevB = orderedB.filter(p => !prevSet.has(p));
      fillersFromB = (nonPrevB.length >= need ? nonPrevB : orderedB).slice(0, need);
      picks = orderedA.concat(fillersFromB);
    }

    fillersFromB.forEach(p => boundaryHits[p]++);
    picks.forEach(p => restCounts[p]++);
    restSchedule.push(picks.slice().sort((a, b) => a - b));
    prevSet = new Set(picks);
  }

  return restSchedule;
}

// --- ペア・対戦割り当て ---
function assignCourts(activePlayers, courts, pairHistory, opponentHistory) {
  const candidates = [];

  // 複数回試行して候補を集める
  for (let trial = 0; trial < 150; trial++) {
    const shuffled = activePlayers.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const pairs = greedyPairing(shuffled, pairHistory);
    if (!pairs) continue;

    const courtAssignments = assignPairsToCourts(pairs, courts, opponentHistory);
    const score = evaluateAssignment(courtAssignments, pairHistory, opponentHistory);
    candidates.push({ assignments: courtAssignments, score });
  }

  // 上位5候補を局所探索で磨き、最良を採用
  candidates.sort((a, b) => a.score - b.score);
  const best = { assignments: null, score: Infinity };
  for (const cand of candidates.slice(0, 5)) {
    const r = localSearchImprove(cand.assignments, pairHistory, opponentHistory);
    if (r.score < best.score) {
      best.score = r.score;
      best.assignments = r.assignments;
    }
  }

  return best.assignments;
}

// 選手2人の入れ替えを全組み合わせで試し、スコアが下がる限り繰り返す局所探索
function localSearchImprove(assignments, pairHistory, opponentHistory) {
  let current = JSON.parse(JSON.stringify(assignments));
  let bestScore = evaluateAssignment(current, pairHistory, opponentHistory);
  let improved = true;
  while (improved) {
    improved = false;
    const positions = [];
    current.forEach((c, ci) => {
      positions.push([ci, 1, 0], [ci, 1, 1], [ci, 2, 0], [ci, 2, 1]);
    });
    for (let x = 0; x < positions.length; x++) {
      for (let y = x + 1; y < positions.length; y++) {
        const [ci1, pi1, s1] = positions[x];
        const [ci2, pi2, s2] = positions[y];
        if (ci1 === ci2 && pi1 === pi2) continue; // 同一ペア内の入替は結果が変わらない
        const trial = JSON.parse(JSON.stringify(current));
        const arr1 = pi1 === 1 ? trial[ci1].pair1 : trial[ci1].pair2;
        const arr2 = pi2 === 1 ? trial[ci2].pair1 : trial[ci2].pair2;
        const tmp = arr1[s1]; arr1[s1] = arr2[s2]; arr2[s2] = tmp;
        const sc = evaluateAssignment(trial, pairHistory, opponentHistory);
        if (sc < bestScore) {
          bestScore = sc;
          current = trial;
          improved = true;
        }
      }
    }
  }
  return { assignments: current, score: bestScore };
}

function greedyPairing(players, pairHistory) {
  const n = players.length;
  const used = new Set();
  const pairs = [];

  const candidates = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = players[i], b = players[j];
      const count = (pairHistory[a] && pairHistory[a][b]) || 0;
      candidates.push({ i, j, a, b, count });
    }
  }
  candidates.sort((x, y) => x.count - y.count);

  for (const c of candidates) {
    if (used.has(c.i) || used.has(c.j)) continue;
    pairs.push([c.a, c.b]);
    used.add(c.i);
    used.add(c.j);
    if (pairs.length === n / 2) break;
  }

  return pairs.length === n / 2 ? pairs : null;
}

function assignPairsToCourts(pairs, courts, opponentHistory) {
  const n = pairs.length;
  const used = new Set();
  const courtAssignments = [];

  const matchups = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      let oppScore = 0;
      for (const a of pairs[i]) {
        for (const b of pairs[j]) {
          oppScore += (opponentHistory[a] && opponentHistory[a][b]) || 0;
        }
      }
      matchups.push({ i, j, score: oppScore });
    }
  }
  matchups.sort((a, b) => a.score - b.score);

  for (const m of matchups) {
    if (used.has(m.i) || used.has(m.j)) continue;
    courtAssignments.push({
      pair1: pairs[m.i],
      pair2: pairs[m.j]
    });
    used.add(m.i);
    used.add(m.j);
    if (courtAssignments.length === courts) break;
  }

  return courtAssignments;
}

// ペア回数は最優先（重み1000）、対戦相手は回数が多いほど急増する超線形ペナルティ
// (c+1)^2 : 0回→1, 1回→4, 2回→9, 3回→16 …「同じ相手と3回目・4回目」を強く回避
function evaluateAssignment(assignments, pairHistory, opponentHistory) {
  if (!assignments) return Infinity;
  let score = 0;
  for (const court of assignments) {
    const p1 = (pairHistory[court.pair1[0]] && pairHistory[court.pair1[0]][court.pair1[1]]) || 0;
    const p2 = (pairHistory[court.pair2[0]] && pairHistory[court.pair2[0]][court.pair2[1]]) || 0;
    score += ((p1 + 1) * (p1 + 1) + (p2 + 1) * (p2 + 1)) * 1000;
    for (const a of court.pair1) {
      for (const b of court.pair2) {
        const c = (opponentHistory[a] && opponentHistory[a][b]) || 0;
        score += (c + 1) * (c + 1);
      }
    }
  }
  return score;
}

function updateHistories(assignments, pairHistory, opponentHistory) {
  for (const court of assignments) {
    const [a1, a2] = court.pair1;
    const [b1, b2] = court.pair2;
    addHistory(pairHistory, a1, a2);
    addHistory(pairHistory, b1, b2);
    for (const a of court.pair1) {
      for (const b of court.pair2) {
        addHistory(opponentHistory, a, b);
      }
    }
  }
}

// マッチアップ自体は変更せず、A/B/C/Dの割当順だけを過去登場回数で最適化
// 二乗ペナルティ：count² の合計を最小化。高頻度コートへの再割当を強く抑制
function balanceCourts(assignments, courtHistory) {
  if (!assignments || assignments.length <= 1) return assignments;
  const n = assignments.length;

  // n! 通りの順列を列挙（最大 4! = 24 通り）
  const perms = [];
  (function permute(arr, current) {
    if (arr.length === 0) { perms.push(current); return; }
    for (let i = 0; i < arr.length; i++) {
      const rest = arr.slice(0, i).concat(arr.slice(i + 1));
      permute(rest, current.concat(arr[i]));
    }
  })([...Array(n).keys()], []);

  let bestScore = Infinity;
  let bestPerm = perms[0];
  for (const perm of perms) {
    let score = 0;
    for (let courtIdx = 0; courtIdx < n; courtIdx++) {
      const m = assignments[perm[courtIdx]];
      const players = m.pair1.concat(m.pair2);
      for (const p of players) {
        const cur = (courtHistory[p] && courtHistory[p][courtIdx]) || 0;
        // (count+1)² = この割当を採用した場合の二乗ペナルティ
        score += (cur + 1) * (cur + 1);
      }
    }
    if (score < bestScore) {
      bestScore = score;
      bestPerm = perm;
    }
  }

  return bestPerm.map(i => assignments[i]);
}

function updateCourtHistory(assignments, courtHistory) {
  assignments.forEach((m, courtIdx) => {
    for (const p of m.pair1) {
      if (!courtHistory[p]) courtHistory[p] = {};
      courtHistory[p][courtIdx] = (courtHistory[p][courtIdx] || 0) + 1;
    }
    for (const p of m.pair2) {
      if (!courtHistory[p]) courtHistory[p] = {};
      courtHistory[p][courtIdx] = (courtHistory[p][courtIdx] || 0) + 1;
    }
  });
}

function addHistory(hist, a, b) {
  if (!hist[a]) hist[a] = {};
  if (!hist[b]) hist[b] = {};
  hist[a][b] = (hist[a][b] || 0) + 1;
  hist[b][a] = (hist[b][a] || 0) + 1;
}

// --- メイン生成 ---
function generate() {
  // 保存済みの状態を誤タップで失わないよう、既存セッションがあるときは確認する
  if (session && !confirm('現在のコート割を破棄して、新しく作成しますか？')) return;

  TOTAL_ROUNDS = parseInt(document.getElementById('roundCount').value);
  const courts = parseInt(document.getElementById('courtCount').value);
  const rosterNames = selectedRosterNames();
  const totalPlayers = rosterNames.length > 0
    ? rosterNames.length
    : parseInt(document.getElementById('playerCount').value);
  const playingCount = courts * 4;
  const restCount = totalPlayers - playingCount;
  if (restCount < 0) {
    alert(`人数が足りません。${courts}コートには${playingCount}人必要です（選択中: ${totalPlayers}人）。\nコート数を減らすかメンバーを追加してください。`);
    return;
  }
  if (totalPlayers > 24) {
    alert('参加人数の上限は24人です。');
    return;
  }

  // 名簿モード：番号をランダムに割り当てる（じゃんけんの代わり）
  let names = null;
  if (rosterNames.length > 0) {
    const shuffled = rosterNames.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    names = {};
    shuffled.forEach((nm, i) => { names[i + 1] = nm; });
  }

  const restOrder = document.getElementById('restOrder').value;
  const allPlayers = Array.from({length: totalPlayers}, (_, i) => i + 1);
  const restSchedule = generateRestSchedule(allPlayers, restCount, TOTAL_ROUNDS, null, null, restOrder === 'desc');

  const pairHistory = {};
  const opponentHistory = {};
  const restHistory = {};
  const courtHistory = {};
  allPlayers.forEach(p => restHistory[p] = 0);

  const rounds = [];

  for (let r = 0; r < TOTAL_ROUNDS; r++) {
    const resting = restSchedule[r];
    const restSet = new Set(resting);
    const active = allPlayers.filter(p => !restSet.has(p));

    resting.forEach(p => restHistory[p]++);

    let assignments;
    if (r === 0 && restOrder === 'desc') {
      // 「最後の番号から休む」の第1節は若い番号がそのまま出場するので、
      // 受付順に並べられるよう番号順の固定配置にする（A: 1,2 vs 3,4 / B: 5,6 vs 7,8 …）
      assignments = [];
      for (let c = 0; c < courts; c++) {
        assignments.push({
          pair1: [active[c * 4], active[c * 4 + 1]],
          pair2: [active[c * 4 + 2], active[c * 4 + 3]]
        });
      }
    } else {
      assignments = assignCourts(active, courts, pairHistory, opponentHistory);
      assignments = balanceCourts(assignments, courtHistory);
    }
    updateHistories(assignments, pairHistory, opponentHistory);
    updateCourtHistory(assignments, courtHistory);

    rounds.push({ round: r + 1, resting, assignments });
  }

  session = {
    totalRounds: TOTAL_ROUNDS,
    initialCourts: courts,
    courts,
    restOrder,
    players: allPlayers.slice(),
    everPlayers: allPlayers.slice(),
    maxNumber: totalPlayers,
    names,
    changes: [],
    rounds
  };
  lastRounds = rounds;
  restoredAt = null;
  saveSession();
  renderResults();
}

// --- メンバー変更（途中追加・離脱） ---
function toggleChip(btn) {
  btn.classList.toggle('selected');
}

function changeLabel(change, prevCourts) {
  const parts = [];
  if (change.added.length > 0) parts.push('＋' + change.added.map(pname).join('・'));
  const returned = change.returned || [];
  if (returned.length > 0) parts.push('↩ ' + returned.map(pname).join('・') + ' 復帰');
  if (change.removed.length > 0) parts.push('−' + change.removed.map(pname).join('・'));
  if (change.courts !== prevCourts) parts.push(change.courts + 'コートへ変更');
  return '↻ メンバー変更' + (parts.length > 0 ? '：' + parts.join(' ／ ') : '（組み直し）');
}

function applyMemberChange() {
  if (!session) return;

  const consumed = parseInt(document.getElementById('consumedRound').value);
  const addNames = document.getElementById('addNameChips')
    ? Array.from(document.querySelectorAll('#addNameChips .chip.selected')).map(b => b.dataset.name)
    : [];
  const addCount = addNames.length + parseInt(document.getElementById('addCount').value);
  const newCourts = parseInt(document.getElementById('changeCourtCount').value);
  const removeNumbers = Array.from(document.querySelectorAll('#removeChips .chip.selected'))
    .map(b => parseInt(b.dataset.num)).sort((a, b) => a - b);
  const returnNumbers = Array.from(document.querySelectorAll('#returnChips .chip.selected'))
    .map(b => parseInt(b.dataset.num)).sort((a, b) => a - b);

  const remaining = session.totalRounds - consumed;
  if (remaining <= 0) return;

  // 新しい参加者リスト（追加は続き番号、離脱は欠番に、復帰は同じ番号で）
  const removedSet = new Set(removeNumbers);
  const continuing = session.players.filter(p => !removedSet.has(p));
  const newNumbers = [];
  for (let i = 1; i <= addCount; i++) newNumbers.push(session.maxNumber + i);
  const newPlayers = continuing.concat(returnNumbers).concat(newNumbers).sort((a, b) => a - b);

  if (newPlayers.length < newCourts * 4) {
    alert(`人数が足りません。${newCourts}コートには${newCourts * 4}人必要です（変更後: ${newPlayers.length}人）。\nコート数を減らしてください。`);
    return;
  }
  if (newPlayers.length > 24) {
    alert('参加人数の上限は24人です。');
    return;
  }

  // 消化済み節から履歴を再構築
  const kept = session.rounds.slice(0, consumed);
  const pairHistory = {};
  const opponentHistory = {};
  const courtHistory = {};
  const restHistory = {};
  session.everPlayers.concat(newNumbers).forEach(p => restHistory[p] = 0);
  for (const round of kept) {
    round.resting.forEach(p => restHistory[p]++);
    updateHistories(round.assignments, pairHistory, opponentHistory);
    updateCourtHistory(round.assignments, courtHistory);
  }

  // 休み回数の引き継ぎ。途中参加者は「現時点の最少回数」扱いで以降を公平に
  const contCounts = continuing.map(p => restHistory[p]);
  const minCont = contCounts.length > 0 ? Math.min(...contCounts) : 0;
  const initialRestCounts = {};
  continuing.forEach(p => initialRestCounts[p] = restHistory[p]);
  // 復帰者は自身の休み履歴を引き継ぐ。不在中に休みが少なくても現役の最少回数までは
  // 引き上げ、復帰直後に休みが集中しないようにする
  returnNumbers.forEach(p => initialRestCounts[p] = Math.max(restHistory[p], minCont));
  newNumbers.forEach(p => initialRestCounts[p] = minCont);

  const restCount = newPlayers.length - newCourts * 4;
  const prevResting = kept.length > 0 ? kept[kept.length - 1].resting : [];
  const restSchedule = generateRestSchedule(newPlayers, restCount, remaining, initialRestCounts, prevResting, session.restOrder === 'desc');

  // 残りの節を、引き継いだ履歴をもとに再生成
  const newRounds = [];
  for (let r = 0; r < remaining; r++) {
    const resting = restSchedule[r];
    const restSet = new Set(resting);
    const active = newPlayers.filter(p => !restSet.has(p));

    resting.forEach(p => restHistory[p]++);

    let assignments = assignCourts(active, newCourts, pairHistory, opponentHistory);
    assignments = balanceCourts(assignments, courtHistory);
    updateHistories(assignments, pairHistory, opponentHistory);
    updateCourtHistory(assignments, courtHistory);

    newRounds.push({ round: consumed + r + 1, resting, assignments });
  }

  session.rounds = kept.concat(newRounds);
  session.players = newPlayers;
  session.everPlayers = session.everPlayers.concat(newNumbers);
  // 名簿から追加した人に新しい番号の名前を割当（ゲストは番号のみ）
  if (addNames.length > 0) {
    if (!session.names) session.names = {};
    addNames.forEach((nm, i) => { session.names[newNumbers[i]] = nm; });
  }
  session.maxNumber += addCount;
  session.courts = newCourts;
  session.changes.push({ atRound: consumed + 1, added: newNumbers, removed: removeNumbers, returned: returnNumbers, courts: newCourts });

  lastRounds = session.rounds;
  restoredAt = null;
  saveSession();
  renderResults();
  alert(`第${consumed + 1}節以降を作り直しました。`);
}

// --- 描画 ---
function renderResults() {
  stopSpeech(); // 再描画で節構成が変わりうるので読み上げは止める
  const rounds = session.rounds;
  const hasChanges = session.changes.length > 0;

  // 履歴を全節から再計算（途中変更後も常に正確に）
  const pairHistory = {};
  const opponentHistory = {};
  const restHistory = {};
  session.everPlayers.forEach(p => restHistory[p] = 0);
  for (const round of rounds) {
    round.resting.forEach(p => restHistory[p]++);
    updateHistories(round.assignments, pairHistory, opponentHistory);
  }

  // 途中参加・離脱・復帰の情報（同じ人が複数回出入りしたら最新の状態を採用）
  const joinedAt = {};   // 番号 → 参加開始節
  const departedAt = {}; // 番号 → 離脱節（この節から不参加）
  const returnedAt = {}; // 番号 → 復帰節
  for (const c of session.changes) {
    c.added.forEach(p => joinedAt[p] = c.atRound);
    c.removed.forEach(p => { departedAt[p] = c.atRound; delete returnedAt[p]; });
    (c.returned || []).forEach(p => returnedAt[p] = c.atRound);
  }

  let html = '';

  if (viewerMode) {
    let ts = '';
    if (sharedAt) {
      const d = new Date(sharedAt);
      ts = `（${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} 作成）`;
    }
    html += `<div class="viewer-banner">🔗 共有された対戦表${ts}`;
    html += `<button onclick="exitViewerMode()">自分のコート割を作る</button></div>`;
  }

  if (restoredAt) {
    const d = new Date(restoredAt);
    const ts = `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    html += `<div class="restore-banner">💾 前回のコート割を復元しました（${ts} 保存）`;
    html += `<button onclick="clearSavedSession()">消去して最初から</button></div>`;
  }

  // 番号表（名簿モードのみ）：誰が何番かを最初に確認できるように
  if (session.names) {
    const activeSet = new Set(session.players);
    html += `<div class="roster-map"><h2>🔢 番号表</h2><div class="roster-map-grid">`;
    for (const p of session.everPlayers.slice().sort((a, b) => a - b)) {
      if (!session.names[p]) continue;
      html += `<span${activeSet.has(p) ? '' : ' class="departed"'}>${pname(p)}</span>`;
    }
    html += `</div></div>`;
  }

  let prevCourts = session.initialCourts;
  for (const round of rounds) {
    const change = session.changes.find(c => c.atRound === round.round);
    if (change) {
      html += `<div class="change-divider">${changeLabel(change, prevCourts)}</div>`;
      prevCourts = change.courts;
    }

    html += `<div class="round-card">`;
    html += `<div class="round-header">`;
    html += `<span class="round-title">第${round.round}節`;
    html += `<button class="btn-speak" data-round="${round.round}" onclick="speakRound(${round.round})" aria-label="この節を読み上げ">🔊</button></span>`;
    if (round.resting.length > 0) {
      const restLabel = session.names
        ? round.resting.map(pname).join('・')
        : round.resting.map(p => p + '番').join(' ');
      html += `<span class="rest-badge">休み: ${restLabel}</span>`;
    } else {
      html += `<span class="rest-badge rest-none">休みなし</span>`;
    }
    html += `</div>`;

    round.assignments.forEach((court, idx) => {
      const p1 = [...court.pair1].sort((a, b) => a - b);
      const p2 = [...court.pair2].sort((a, b) => a - b);
      const [left, right] = p1[0] <= p2[0] ? [p1, p2] : [p2, p1];
      html += `<div class="court-match">`;
      html += `<span class="court-label">${COURT_LABELS[idx]}</span>`;
      html += `<span class="match-detail${session.names ? ' md-names' : ''}">`;
      html += `<span class="pair">${pname(left[0])}</span>`;
      html += `<span class="pair-sep">・</span>`;
      html += `<span class="pair">${pname(left[1])}</span>`;
      html += `<span class="vs"> VS </span>`;
      html += `<span class="pair">${pname(right[0])}</span>`;
      html += `<span class="pair-sep">・</span>`;
      html += `<span class="pair">${pname(right[1])}</span>`;
      html += `</span>`;
      html += `</div>`;
    });

    html += `</div>`;
  }

  // 共有ボタン（URLにセッションを埋め込んだリンクを配る）
  html += `<button class="btn-share" onclick="shareLink()">🔗 対戦表のリンクを共有</button>`;
  html += `<div class="save-hint">リンクを開いた人のスマホにも同じ対戦表が表示されます</div>`;

  // 画像保存ボタン
  html += `<button class="btn-save" onclick="saveAsImage()">📷 対戦表を画像として保存</button>`;
  html += `<div class="save-hint">スマホは画像長押し、PCは右クリックでも保存可</div>`;
  html += `<div id="imagePreview"></div>`;

  // メンバー変更UI（閲覧モードでは出さない）
  if (!viewerMode) {
    const minConsumed = hasChanges
      ? session.changes[session.changes.length - 1].atRound
      : 1;
    html += `<div class="change-section">`;
    html += `<h2>⚙ メンバー変更（途中追加・離脱）</h2>`;
    html += `<div class="change-info">途中で人が増えた・帰ったとき、消化済みの節はそのままに残りを作り直します。これまでのペア・対戦・休みは引き継がれます。</div>`;
    html += `<div class="input-row"><label>消化済み</label><select id="consumedRound">`;
    for (let k = minConsumed; k <= session.totalRounds - 1; k++) {
      html += `<option value="${k}">第${k}節まで終了</option>`;
    }
    html += `</select></div>`;
    if (session.names) {
      // 名簿からの途中追加（名前付き・新しい番号が振られる）
      const usedNames = new Set();
      for (const p of session.everPlayers) if (session.names[p]) usedNames.add(session.names[p]);
      const avail = ROSTER.filter(nm => !usedNames.has(nm));
      if (avail.length > 0) {
        html += `<div class="chips-label">追加する人（名簿から・タップで選択）</div>`;
        html += `<div class="chips" id="addNameChips">`;
        for (const nm of avail) {
          html += `<button class="chip chip-add" data-name="${nm}" onclick="toggleChip(this)">${nm}</button>`;
        }
        html += `</div>`;
      }
    }
    const addLabel = session.names ? 'ゲスト追加' : '追加人数';
    html += `<div class="input-row"><label>${addLabel}</label><select id="addCount">`;
    for (let i = 0; i <= 8; i++) {
      const label = i === 0
        ? 'なし'
        : session.names
          ? `+${i}人（名簿外）`
          : i === 1
            ? `+1人（${session.maxNumber + 1}番）`
            : `+${i}人（${session.maxNumber + 1}〜${session.maxNumber + i}番）`;
      html += `<option value="${i}">${label}</option>`;
    }
    html += `</select></div>`;
    html += `<div class="chips-label">離脱する人（タップで選択）</div>`;
    html += `<div class="chips" id="removeChips">`;
    for (const p of session.players) {
      html += `<button class="chip" data-num="${p}" onclick="toggleChip(this)">${pname(p)}</button>`;
    }
    html += `</div>`;
    const currentPlayersSet = new Set(session.players);
    const departedNow = session.everPlayers.filter(p => !currentPlayersSet.has(p));
    if (departedNow.length > 0) {
      html += `<div class="chips-label">復帰する人（タップで選択・同じ番号で戻ります）</div>`;
      html += `<div class="chips" id="returnChips">`;
      for (const p of departedNow) {
        html += `<button class="chip chip-return" data-num="${p}" onclick="toggleChip(this)">${pname(p)}</button>`;
      }
      html += `</div>`;
    }
    html += `<div class="input-row"><label>コート数</label><select id="changeCourtCount">`;
    for (let c = 2; c <= 4; c++) {
      html += `<option value="${c}"${c === session.courts ? ' selected' : ''}>${c}コート</option>`;
    }
    html += `</select></div>`;
    html += `<button class="btn btn-change" onclick="applyMemberChange()">残りの節を作り直す</button>`;
    html += `</div>`;
  }

  // 休み履歴
  html += `<div class="stats-section">`;
  html += `<h2>休み回数</h2>`;
  html += `<table class="stats-table">`;
  html += `<tr><th>番号</th><th>休み回数</th><th>休んだ節</th></tr>`;

  const currentSet = new Set(session.players);
  const currentRestValues = session.players.map(p => restHistory[p]);
  const minRest = currentRestValues.length > 0 ? Math.min(...currentRestValues) : 0;
  const maxRest = currentRestValues.length > 0 ? Math.max(...currentRestValues) : 0;

  for (const p of session.everPlayers) {
    const restRounds = rounds
      .filter(r => r.resting.includes(p))
      .map(r => r.round);
    let note = '';
    if (!currentSet.has(p)) {
      if (departedAt[p]) note = `<span class="player-note">（第${departedAt[p]}節〜離脱）</span>`;
    } else if (returnedAt[p]) {
      note = `<span class="player-note">（第${returnedAt[p]}節〜復帰）</span>`;
    } else if (joinedAt[p]) {
      note = `<span class="player-note">（第${joinedAt[p]}節〜参加）</span>`;
    }
    html += `<tr${currentSet.has(p) ? '' : ' class="departed-row"'}>`;
    html += `<td>${pname(p)}${note}</td>`;
    html += `<td>${restHistory[p]}</td>`;
    html += `<td style="font-size:0.8em">${restRounds.length > 0 ? restRounds.join(', ') : '-'}</td>`;
    html += `</tr>`;
  }
  html += `</table>`;
  html += `<div style="margin-top:8px;font-size:0.82em;color:#666">`;
  if (maxRest > 0) {
    html += `休み回数（現メンバー）: 最小${minRest}回 〜 最大${maxRest}回（差: ${maxRest - minRest}回）`;
    if (hasChanges) {
      html += `<br>※ 途中参加・離脱があるため、在籍期間によって回数に差が出ることがあります`;
    }
  }
  html += `</div>`;
  html += `</div>`;

  // ペア統計
  html += `<div class="pair-stats-section">`;
  html += `<h2>ペア回数統計</h2>`;
  html += `<div class="pair-stats-info">`;

  const pairCounts = {};
  let occurredPairs = 0;
  for (const a in pairHistory) {
    for (const b in pairHistory[a]) {
      if (parseInt(a) < parseInt(b)) {
        const count = pairHistory[a][b];
        if (!pairCounts[count]) pairCounts[count] = 0;
        pairCounts[count]++;
        occurredPairs++;
      }
    }
  }
  const everCount = session.everPlayers.length;
  const totalPossiblePairs = everCount * (everCount - 1) / 2;
  const neverPaired = totalPossiblePairs - occurredPairs;

  html += `<strong>同じペアの回数分布:</strong><br>`;
  if (neverPaired > 0) {
    html += `0回ペア: ${neverPaired}組（一度も組めなかったペア）<br>`;
  }
  const sortedCounts = Object.keys(pairCounts).sort((a, b) => parseInt(a) - parseInt(b));
  for (const count of sortedCounts) {
    html += `${count}回ペア: ${pairCounts[count]}組<br>`;
  }
  html += `<br><em>※ 全${totalPossiblePairs}組中、組めたのは${occurredPairs}組（ペア回数が少ないほど偏りが小さい）</em>`;
  if (hasChanges) {
    html += `<br><em>※ 途中参加・離脱した人を含むため、組めない組み合わせがあります</em>`;
  }
  html += `</div></div>`;

  document.getElementById('results').innerHTML = html;
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

// --- 画像保存 ---
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function saveAsImage() {
  if (!lastRounds || lastRounds.length === 0) return;

  // 10/15節向け最適化：節数が少ないときはレイアウト寸法を拡大して可読性UP
  // 15節以下は2倍、16-25節は1.2倍、26節以上は等倍（Canvas寸法上限内で最大化）
  const n = lastRounds.length;
  const SCALE = n <= 15 ? 2.0 : (n <= 25 ? 1.2 : 1.0);

  const W = 600 * SCALE;
  const PAD = 16 * SCALE;
  const CARD_GAP = 12 * SCALE;
  const CARD_R = 12 * SCALE;
  const HEADER_H = 44 * SCALE;
  const COURT_H = 38 * SCALE;
  const TITLE_H = 56 * SCALE;
  const MARK_H = 34 * SCALE; // メンバー変更マーカー帯の高さ
  const FONT = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif';

  const changes = (session && session.changes) || [];
  const names = (session && session.names) || null;
  const iname = p => names && names[p] ? p + ' ' + names[p] : p + '番';

  // 番号表（名簿モードのみ、タイトル直下に3列で並べる）
  const mapEntries = names
    ? session.everPlayers.filter(p => names[p]).sort((a, b) => a - b)
    : [];
  const MAP_COLS = 3;
  const MAP_HEAD = 30 * SCALE;
  const MAP_ROW_H = 24 * SCALE;
  const mapRows = Math.ceil(mapEntries.length / MAP_COLS);
  const mapH = mapEntries.length > 0 ? MAP_HEAD + mapRows * MAP_ROW_H + 10 * SCALE : 0;

  // 高さ計算
  let totalH = PAD + TITLE_H + PAD;
  if (mapH > 0) totalH += mapH + CARD_GAP;
  lastRounds.forEach((round, i) => {
    if (changes.some(c => c.atRound === round.round)) {
      totalH += MARK_H + CARD_GAP;
    }
    totalH += HEADER_H + round.assignments.length * COURT_H;
    if (i < lastRounds.length - 1) totalH += CARD_GAP;
  });
  totalH += PAD;

  // モバイルCanvasの寸法上限に収まる範囲で最大解像度を確保
  // iOS Safariは「総ピクセル数 16,777,216 (=4096×4096)」が上限で、超えると
  // 描画バッファが無効化・低解像度化して出力がぼやける。全端末この上限に合わせる
  const MAX_DIM = 16384;
  const MAX_AREA = 16777216;
  const dimScale = Math.min(MAX_DIM / W, MAX_DIM / totalH);
  const areaScale = Math.sqrt(MAX_AREA / (W * totalH));
  const dpr = Math.max(1, Math.min(4, window.devicePixelRatio || 1, dimScale, areaScale));
  const canvas = document.createElement('canvas');
  canvas.width = W * dpr;
  canvas.height = totalH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // 背景
  ctx.fillStyle = '#f0f4f8';
  ctx.fillRect(0, 0, W, totalH);

  // タイトル
  ctx.fillStyle = '#c6e3d6';
  roundRectPath(ctx, PAD, PAD, W - PAD * 2, TITLE_H - 8 * SCALE, 10 * SCALE);
  ctx.fill();
  ctx.fillStyle = '#1a5276';
  ctx.font = `bold ${22 * SCALE}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏸 ダブルス コート割', W / 2, PAD + (TITLE_H - 8 * SCALE) / 2);

  // 番号表カード
  let y = PAD + TITLE_H;
  if (mapH > 0) {
    ctx.fillStyle = '#fff';
    roundRectPath(ctx, PAD, y, W - PAD * 2, mapH, CARD_R);
    ctx.fill();
    ctx.fillStyle = '#1a5276';
    ctx.font = `bold ${14 * SCALE}px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('番号表', PAD + 14 * SCALE, y + MAP_HEAD / 2 + 3 * SCALE);
    ctx.font = `${13 * SCALE}px ${FONT}`;
    ctx.fillStyle = '#2c3e50';
    const colW = (W - PAD * 2 - 28 * SCALE) / MAP_COLS;
    mapEntries.forEach((p, i) => {
      const mx = PAD + 14 * SCALE + (i % MAP_COLS) * colW;
      const my = y + MAP_HEAD + Math.floor(i / MAP_COLS) * MAP_ROW_H + MAP_ROW_H / 2;
      ctx.fillText(iname(p), mx, my);
    });
    y += mapH + CARD_GAP;
  }

  // 各節カード
  let prevCourts = session ? session.initialCourts : lastRounds[0].assignments.length;
  for (let ri = 0; ri < lastRounds.length; ri++) {
    const round = lastRounds[ri];
    const cardH = HEADER_H + round.assignments.length * COURT_H;
    const cardW = W - PAD * 2;

    // メンバー変更マーカー帯
    const change = changes.find(c => c.atRound === round.round);
    if (change) {
      ctx.fillStyle = '#fff3e0';
      roundRectPath(ctx, PAD, y, cardW, MARK_H, 8 * SCALE);
      ctx.fill();
      ctx.fillStyle = '#ff9800';
      ctx.fillRect(PAD, y + 4 * SCALE, 4 * SCALE, MARK_H - 8 * SCALE);

      const label = changeLabel(change, prevCourts);
      prevCourts = change.courts;
      // 帯に収まるようフォントサイズを自動調整
      let fontSize = 13 * SCALE;
      const maxTextW = cardW - 28 * SCALE;
      ctx.font = `bold ${fontSize}px ${FONT}`;
      const textW = ctx.measureText(label).width;
      if (textW > maxTextW) {
        fontSize = Math.max(9 * SCALE, fontSize * maxTextW / textW);
        ctx.font = `bold ${fontSize}px ${FONT}`;
      }
      ctx.fillStyle = '#e65100';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, PAD + 14 * SCALE, y + MARK_H / 2);

      y += MARK_H + CARD_GAP;
    }

    // カード背景（白角丸）+ シャドウ
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.08)';
    ctx.shadowBlur = 6 * SCALE;
    ctx.shadowOffsetY = 2 * SCALE;
    ctx.fillStyle = '#fff';
    roundRectPath(ctx, PAD, y, cardW, cardH, CARD_R);
    ctx.fill();
    ctx.restore();

    // ヘッダー（カード上部のみ）
    ctx.save();
    roundRectPath(ctx, PAD, y, cardW, HEADER_H + 1, CARD_R);
    ctx.clip();
    ctx.fillStyle = '#34495e';
    ctx.fillRect(PAD, y, cardW, HEADER_H);
    ctx.restore();

    // "第N節"
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${16 * SCALE}px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`第${round.round}節`, PAD + 14 * SCALE, y + HEADER_H / 2);

    // 休みバッジ（名前入りで長いときはフォントを縮小、それでも入らなければ番号のみ）
    const restingSorted = [...round.resting].sort((a, b) => a - b);
    const hasRest = restingSorted.length > 0;
    let badgeText = hasRest
      ? `休み: ${restingSorted.map(iname).join(names ? '・' : ' ')}`
      : '休みなし';
    const badgePadX = 10 * SCALE;
    const maxBadgeW = cardW - 110 * SCALE; // 左の「第N節」と重ならない範囲
    let badgeFont = 13 * SCALE;
    ctx.font = `bold ${badgeFont}px ${FONT}`;
    let badgeTextW = ctx.measureText(badgeText).width;
    if (badgeTextW + badgePadX * 2 > maxBadgeW) {
      const fit = badgeFont * (maxBadgeW - badgePadX * 2) / badgeTextW;
      if (fit < 9 * SCALE && names && hasRest) {
        badgeText = `休み: ${restingSorted.map(p => p + '番').join(' ')}`;
        badgeFont = 13 * SCALE;
      } else {
        badgeFont = Math.max(9 * SCALE, fit);
      }
      ctx.font = `bold ${badgeFont}px ${FONT}`;
      badgeTextW = ctx.measureText(badgeText).width;
      if (badgeTextW + badgePadX * 2 > maxBadgeW) {
        badgeFont = Math.max(8 * SCALE, badgeFont * (maxBadgeW - badgePadX * 2) / badgeTextW);
        ctx.font = `bold ${badgeFont}px ${FONT}`;
        badgeTextW = ctx.measureText(badgeText).width;
      }
    }
    const badgeW = badgeTextW + badgePadX * 2;
    const badgeH = 22 * SCALE;
    const badgeX = PAD + cardW - 14 * SCALE - badgeW;
    const badgeY = y + HEADER_H / 2 - badgeH / 2;
    ctx.fillStyle = hasRest ? '#e74c3c' : '#27ae60';
    roundRectPath(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(badgeText, badgeX + badgeW / 2, y + HEADER_H / 2);

    // コート行
    let cy = y + HEADER_H;
    round.assignments.forEach((court, idx) => {
      // 区切り線（最後以外）
      if (idx < round.assignments.length - 1) {
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(PAD + 14 * SCALE, cy + COURT_H - 1, cardW - 28 * SCALE, 1);
      }

      // コートラベル
      const labelW = 34 * SCALE;
      const labelH = 26 * SCALE;
      const labelX = PAD + 14 * SCALE;
      const labelY = cy + COURT_H / 2 - labelH / 2;
      ctx.fillStyle = '#3498db';
      roundRectPath(ctx, labelX, labelY, labelW, labelH, 6 * SCALE);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${15 * SCALE}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(COURT_LABELS[idx], labelX + labelW / 2, cy + COURT_H / 2);

      // 対戦表示（小さい番号を左に）
      const p1 = [...court.pair1].sort((a, b) => a - b);
      const p2 = [...court.pair2].sort((a, b) => a - b);
      const [left, right] = p1[0] <= p2[0] ? [p1, p2] : [p2, p1];

      const segs = [
        { t: iname(left[0]),  c: '#2c3e50' },
        { t: '・',            c: '#7f8c8d' },
        { t: iname(left[1]),  c: '#2c3e50' },
        { t: '  VS  ',        c: '#e74c3c' },
        { t: iname(right[0]), c: '#2c3e50' },
        { t: '・',            c: '#7f8c8d' },
        { t: iname(right[1]), c: '#2c3e50' },
      ];
      let segFont = 16 * SCALE;
      ctx.font = `bold ${segFont}px ${FONT}`;
      let segW = 0;
      for (const s of segs) segW += ctx.measureText(s.t).width;

      // コートラベル右端 〜 カード右端 の中央に配置（名前入りで長ければ縮小）
      const areaLeft = labelX + labelW + 6 * SCALE;
      const areaRight = PAD + cardW - 14 * SCALE;
      if (segW > areaRight - areaLeft) {
        segFont = Math.max(10 * SCALE, segFont * (areaRight - areaLeft) / segW);
        ctx.font = `bold ${segFont}px ${FONT}`;
        segW = 0;
        for (const s of segs) segW += ctx.measureText(s.t).width;
      }
      let tx = areaLeft + (areaRight - areaLeft - segW) / 2;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (const s of segs) {
        ctx.fillStyle = s.c;
        ctx.fillText(s.t, tx, cy + COURT_H / 2);
        tx += ctx.measureText(s.t).width;
      }

      cy += COURT_H;
    });

    y += cardH + CARD_GAP;
  }

  // ダウンロード & プレビュー
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const pad2 = n => String(n).padStart(2, '0');
    const ts = `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    const filename = `badminton_${ts}.png`;

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // プレビュー表示（スマホ長押し保存用）
    const preview = document.getElementById('imagePreview');
    if (preview) {
      preview.innerHTML = `<img src="${url}" alt="対戦表"/>`;
    }

    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 'image/png');
}

// 起動
initUI();
// 共有リンクで開かれたら閲覧モード、そうでなければ自分の保存データを復元
if (!loadFromShareLink()) restoreSession();
// 開いたままのタブに別の共有リンクが渡されたとき（ハッシュだけの遷移）も反映する
window.addEventListener('hashchange', () => location.reload());
</script>
